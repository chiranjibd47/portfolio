<footer class="portfolio-footer">
  <div class="portfolio-container">
    <div class="footer-top-row">
      <!-- Monogram & Identity -->
      <div class="footer-brand">
        <div class="footer-monogram" (click)="scrollTo('hero')">
          <span>CD</span>
        </div>
        <div class="footer-identity">
          <span class="footer-name">{{ profile.name }}</span>
          <span class="footer-sub">{{ profile.role }} · Infosys</span>
        </div>
      </div>

      <!-- Navigation links -->
      <nav class="footer-nav">
        <a (click)="scrollTo('about')" class="footer-link">About</a>
        <a (click)="scrollTo('experience')" class="footer-link">Experience</a>
        <a (click)="scrollTo('projects')" class="footer-link">Projects</a>
        <a (click)="scrollTo('skills')" class="footer-link">Skills</a>
        <a (click)="scrollTo('approach')" class="footer-link">Approach</a>
        <a (click)="scrollTo('education')" class="footer-link">Education</a>
        <a (click)="scrollTo('contact')" class="footer-link">Contact</a>
      </nav>

      <!-- Back to top button -->
      <button (click)="scrollTo('hero')" class="back-to-top-btn" aria-label="Back to top">
        <span>Back to Top</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="19" x2="12" y2="5"></line>
          <polyline points="5 12 12 5 19 12"></polyline>
        </svg>
      </button>
    </div>

    <!-- Divider -->
    <div class="footer-divider"></div>

    <!-- Bottom credits row -->
    <div class="footer-bottom-row">
      <p class="copyright-text">
        © {{ currentYear }} {{ profile.name }}. All rights reserved.
      </p>

      <div class="footer-status-pill">
        <span class="status-dot"></span>
        <span>Built with Angular 15 & Clean Engineering Principles</span>
      </div>

      <div class="footer-social-links">
        <a href="https://linkedin.com" target="_blank" rel="noopener noreferrer" class="social-icon-link" aria-label="LinkedIn">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>
          </svg>
        </a>
        <a [href]="'mailto:' + profile.email" class="social-icon-link" aria-label="Email">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
        </a>
      </div>
    </div>
  </div>
</footer>
